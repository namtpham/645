name: Deploy result checker

# Deploys supabase/functions/check-tickets to your Supabase project (with JWT verification off,
# because the function checks callers itself). Needs one repository secret:
#   SUPABASE_ACCESS_TOKEN — create it at https://supabase.com/dashboard/account/tokens
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-function.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy check-tickets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            msg="Add the repository secret SUPABASE_ACCESS_TOKEN first (see README → Automatic result check)."
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg Skipping deploy."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" web/config.js)
          REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          set +e
          supabase functions deploy check-tickets --project-ref "$REF" --no-verify-jwt 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -q 'missing_permissions' deploy.log; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret lacks permission to deploy Edge Functions. Create a new Supabase access token with Edge Functions read & write access for this project (or full access), replace the GitHub secret, and run this workflow again."
          fi
          exit $code
      - name: Self-test
        if: env.SKIP != '1'
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" web/config.js)
          sleep 5
          curl -sS "$URL/functions/v1/check-tickets" | tee /dev/stderr | grep -q '"ok":true'
