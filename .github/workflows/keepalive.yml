name: Keep Supabase awake

# Free Supabase projects are paused after a week without activity.
# This pings the database twice a week so the site is always ready on Saturday.
on:
  schedule:
    - cron: '17 3 * * 2,5'   # Tue & Fri 12:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" web/config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" web/config.js)
          case "$URL" in *YOUR-PROJECT*) echo "web/config.js not filled in yet — skipping"; exit 0;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
