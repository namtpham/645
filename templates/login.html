<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #07090f;
      --card:    #111827;
      --border:  #1e2d4a;
      --gold:    #f59e0b;
      --goldlt:  #fbbf24;
      --emerald: #10b981;
      --text:    #e2e8f0;
      --dim:     #94a3b8;
      --muted:   #4b5675;
      --red:     #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Mesh background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 70% at 15% 15%, rgba(245,158,11,.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 85%, rgba(16,185,129,.05) 0%, transparent 55%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(59,130,246,.03) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb1 { width: 300px; height: 300px; background: var(--gold); top: -80px; left: -80px; animation-delay: 0s; }
    .orb2 { width: 200px; height: 200px; background: var(--emerald); bottom: -60px; right: -40px; animation-delay: -6s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.1); }
    }

    /* Card */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px 40px;
      width: 380px;
      max-width: 93vw;
      box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(245,158,11,.07);
      animation: rise .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Gold top rule */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 55%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Logo */
    .logo { text-align: center; margin-bottom: 36px; }
    .logo-icon { font-size: 44px; margin-bottom: 10px; display: block; }
    .logo-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .logo-title em { color: var(--gold); font-style: normal; }
    .logo-sub {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Form */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="password"]::placeholder { color: var(--muted); }
    input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,158,11,.12);
    }

    .error {
      margin-top: 12px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
    }

    button[type="submit"] {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: var(--gold);
      border: none;
      border-radius: 10px;
      color: #09090b;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background .15s, transform .1s;
    }
    button[type="submit"]:hover { background: var(--goldlt); }
    button[type="submit"]:active { transform: scale(.98); }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card">
    <div class="logo">
      <span class="logo-icon">🎰</span>
      <div class="logo-title">Lucky <em>Pool</em></div>
      <div class="logo-sub">Group Lottery Tracker</div>
    </div>
    <form method="POST" action="/login">
      <label for="pw">Access Password</label>
      <input type="password" id="pw" name="password" placeholder="Enter password…" autofocus autocomplete="current-password">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">Enter the Pool →</button>
    </form>
    <p class="hint">One password for all members of your group.</p>
  </div>
</body>
</html>
